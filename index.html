<script>
(function () {
  var btn = document.getElementById('installBtn'), toast = document.getElementById('toast'), deferred = null;
  function show(msg, action, fn) {
    toast.innerHTML = msg + (action ? ' <button>' + action + '</button>' : '');
    toast.hidden = false;
    if (fn) toast.querySelector('button').onclick = fn; else setTimeout(function () { toast.hidden = true; }, 3500);
  }
  var standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferred = e; if (!standalone) btn.hidden = false; });
  btn.onclick = function () {
    if (deferred) { deferred.prompt(); deferred.userChoice.finally(function () { deferred = null; btn.hidden = true; }); }
    else document.getElementById('iosHint').hidden = false;
  };
  window.addEventListener('appinstalled', function () { btn.hidden = true; show('✅ Dakkhota অ্যাপ ইনস্টল হয়েছে'); });
  var ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  if (ios && !standalone) btn.hidden = false;
  document.getElementById('iosClose').onclick = function () { document.getElementById('iosHint').hidden = true; };

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').then(function (reg) {
        function ask(w) { show('🔄 নতুন আপডেট এসেছে', 'আপডেট করো', function () { w.postMessage('skipWaiting'); }); }
        if (reg.waiting && navigator.serviceWorker.controller) ask(reg.waiting);
        reg.addEventListener('updatefound', function () {
          var w = reg.installing;
          w.addEventListener('statechange', function () { if (w.state === 'installed' && navigator.serviceWorker.controller) ask(w); });
        });
        setInterval(function () { reg.update(); }, 30 * 60 * 1000);
        document.addEventListener('visibilitychange', function () { if (!document.hidden) reg.update(); });
      });
      var reloaded = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () { if (!reloaded) { reloaded = true; location.reload(); } });
    });
  }
  window.addEventListener('offline', function () { show('📴 অফলাইন: আগে খোলা অধ্যায়গুলো পড়া যাবে'); });
  window.addEventListener('online', function () { show('🌐 আবার অনলাইনে'); });
})();
</script>
